*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 60px}

.btn{font:inherit;border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500}
.actions{display:flex;gap:8px}
#view{background:var(--bg);padding:4px}
.btn:hover{background:var(--brand);color:var(--surface)}

.notes{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:8px}
.notes li{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.92rem;border-inline-start:4px solid var(--warn)}

.tt-scroll{overflow-x:auto;border-radius:14px}

  .print-head .by b{display:block;font-size:12pt;color:var(--brand);direction:ltr}

  .empty{border:0;min-height:0;height:auto}

  .item.bad .sub::before{content:"⚠ ";color:var(--warn)}

  .legend{margin-top:2.5mm;gap:5mm;font-size:8pt}
  .footnote{font-size:7.5pt;margin-top:1mm}
  .sw{width:3mm;height:3mm}
}

};

const LEVELS={L1,L2,L3,L4};
let LV=L2, SEC=1;

const groupOf=sec=>+Object.keys(LV.groups).find(g=>LV.groups[g].includes(sec));
const forSec=sec=>LV.E.filter(e=>e.t==="lec"?e.g===groupOf(sec):e.secs.includes(sec));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function itemHTML(e){
  const s=LV.subj[e.sub];
  const lines=[];
  if(e.t==="lec"){ if(e.time) lines.push("الساعة "+e.time); lines.push(e.who); lines.push(e.room);}
  else{
    if(e.lab===PHL) lines.push("Physics Lab");
    else if(e.lab) lines.push("Lab "+e.lab);
    if(e.room) lines.push(e.room==="غير محددة"?"القاعة: غير محددة":"Room "+e.room);
    if(LV.hasStaff) lines.push(e.who||"المعيد: غير محدد");
    if(e.secs.length>1) lines.push("مع سكاشن: "+e.secs.join("، "));
  }
  return `<div class="item ${e.t}${e.flag?" bad":""}" style="--c:var(${s.c})">
    <span class="kind">${e.t==="lec"?"محاضرة":"سكشن"}</span>
    <span class="sub">${esc(s.n)}</span>
    ${lines.map(l=>`<span class="meta${l.startsWith("مع سكاشن")?" with":""}"${/[\u0600-\u06FF]/.test(l)?' style="direction:rtl"':''}>${esc(l)}</span>`).join("")}
    ${e.flag?`<span class="flagtxt">⚠ ${esc(e.flag)}</span>`:""}
  </div>`;
}

function flaggedSet(){
  const f=new Set(Object.keys(LV.secNotes).map(Number));
  Object.keys(LV.groupNotes).forEach(g=>LV.groups[g].forEach(x=>f.add(x)));
  LV.E.forEach(e=>{ if(!e.flag) return;
    (e.t==="sec"?e.secs:LV.groups[e.g]).forEach(x=>f.add(x)); });
  return f;
}

function renderChrome(){
  document.getElementById("h1").textContent=`جدول السكاشن – ${LV.name}`;
  document.querySelectorAll(".lvl").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lv===LV.key?"true":"false"));
  const fl=flaggedSet();
  document.getElementById("picker").innerHTML=Object.entries(LV.groups).map(([g,list])=>
    `<div class="grp"><h2>مجموعة م${g}</h2><div class="nums">${list.map(n=>
      `<button class="num${fl.has(n)?" flag":""}" data-sec="${n}" aria-pressed="false" aria-label="سكشن ${n}${fl.has(n)?"، فيه ملاحظة":""}">${n}</button>`).join("")}</div></div>`).join("");
  document.getElementById("picker").style.setProperty("--cols",Object.keys(LV.groups).length);
  document.getElementById("legend").innerHTML=Object.values(LV.subj).map(s=>
    `<span><i class="sw" style="background:var(${s.c})"></i>${esc(s.n)}</span>`).join("")+
    `<span><i class="sw" style="background:var(--muted)"></i>محاضرة (ملونة بالكامل)</span><span><i class="sw o"></i>سكشن (إطار ملون)</span>`;
  document.getElementById("source").textContent=`الجدول مأخوذ من ${LV.source}. لو فيه اختلاف، الجدول الرسمي هو المرجع.`;
  document.getElementById("footnote").textContent=LV.footnote;
}

function render(sec){
  SEC=sec;
  const items=forSec(sec), g=groupOf(sec);
  const at=(d,s)=>items.filter(e=>e.d===d&&e.s===s);
  const lec=items.filter(e=>e.t==="lec").length, secs=items.filter(e=>e.t==="sec").length;
  const notes=[];
  for(let d=0;d<5;d++)for(let s=0;s<4;s++) if(at(d,s).length>1) notes.push(`تضارب: عندك ${at(d,s).length} حاجات يوم ${DAYS[d]} ${SLOTS[s]}`);
  if(LV.secNotes[sec]) notes.push(LV.secNotes[sec]);
  (LV.groupNotes[g]||[]).forEach(n=>notes.push(n));
  const skip=new Set(Object.values(LV.groupNotes).flat());
  [...new Set(items.filter(e=>e.flag&&!e.flag.startsWith("تضارب")&&!e.flag.startsWith("مكرر")&&!e.flag.includes("مرتين (السبت"))
     .map(e=>`${DAYS[e.d]} ${SLOTS[e.s]}: ${e.flag}`))].forEach(n=>notes.push(n));

  let rows="";
  DAYS.forEach((dn,d)=>{
    rows+=`<tr><th class="day" scope="row">${dn}</th>`;
    SLOTS.forEach((_,s)=>{
      const c=at(d,s);
      rows+=`<td>${c.length?`<div class="cell">${c.map(itemHTML).join("")}</div>`:`<div class="empty" aria-label="فاضي"></div>`}</td>`;
    });
    rows+="</tr>";
  });

  let list="";
  DAYS.forEach((dn,d)=>{
    const has=SLOTS.map((t,s)=>({t,c:at(d,s)})).filter(x=>x.c.length);
    list+=`<section class="dayblk"><h3>${dn}</h3>${has.length?has.map(x=>`<div class="row"><div class="time">${x.t}</div><div class="cell">${x.c.map(itemHTML).join("")}</div></div>`).join(""):`<div class="off">يوم فاضي</div>`}</section>`;
  });

  document.getElementById("view").outerHTML=`<main id="view">
    <div class="print-head">
      <div class="sec"><span class="n">${sec}</span><span class="l">سكشن<b>مجموعة م${g}</b></span></div>
      <div class="ttl"><h2>جدول المحاضرات والسكاشن – ${LV.name}</h2>
        <p>كلية الحاسبات والذكاء الاصطناعي، جامعة المنيا الأهلية · الفصل الأول 2026/2027 · ${lec} محاضرات و ${secs} سكاشن</p></div>
      <div class="by">إعداد<b>Youssef Jo</b></div>
    </div>
    <div class="head">
      <div>
        <div class="bigsec"><span class="n">${sec}</span><span class="t">سكشن · ${LV.name}<b>مجموعة م${g}</b></span></div>
        <div class="stats">${lec} محاضرات · ${secs} سكاشن · إعداد <span class="byline">Youssef Jo</span></div>
      </div>
      <div class="actions"><button class="btn" id="saveImg">احفظ صورة</button><button class="btn" id="printBtn">اطبع</button></div>
    </div>
    ${notes.length?`<ul class="notes">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
    <div class="tt-scroll"><table class="tt">
      <thead><tr><th>اليوم</th>${SLOTS.map(t=>`<th scope="col">${t}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="list">${list}</div>
  </main>`;

  document.querySelectorAll(".num").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.sec===sec?"true":"false"));
  document.title=`سكشن ${sec} – ${LV.name} | Youssef Jo`;
  try{localStorage.setItem("pick",LV.key+"-"+sec)}catch(e){}
  const h=LV.key==="L2"?"#"+sec:"#L1-"+sec;
  if(location.hash!==h) history.replaceState(null,"",h);
}

function setLevel(key,sec){
  LV=LEVELS[key]; renderChrome();
  const max=Math.max(...Object.values(LV.groups).flat());
  render(sec>=1&&sec<=max?sec:1);
}

// actions
document.addEventListener("click",async ev=>{
  const t=ev.target;
  if(t.closest(".lvl")){ const k=t.closest(".lvl").dataset.lv; if(k!==LV.key) setLevel(k,1); return; }
  if(t.closest(".num")){ render(+t.closest(".num").dataset.sec); return; }
  if(t.id==="printBtn"){ window.print(); }
  if(t.id==="saveImg"){
    t.disabled=true; t.textContent="جاري الحفظ…";
    try{
      const node=document.getElementById("view");
      const bg=getComputedStyle(document.body).backgroundColor;
      const url=await htmlToImage.toPng(node,{pixelRatio:2,backgroundColor:bg,
        filter:n=>!(n.classList&&(n.classList.contains("actions")||n.classList.contains("print-head")))});
      const a=document.createElement("a");
      a.href=url; a.download=`جدول-${LV.key}-سكشن-${SEC}.png`; document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ alert("مقدرتش أحفظ الصورة. جرب زرار اطبع واختار حفظ كـ PDF."); }
    t.disabled=false; t.textContent="احفظ صورة";
  }
});

function fromHash(){
  const h=location.hash.slice(1);
  let m=h.match(/^L([1-4])-(\d+)$/i);
  if(m) return ["L"+m[1],+m[2]];
  if(/^\d+$/.test(h)) return ["L2",+h];
  return null;
}
let start=fromHash();
if(!start){ try{const v=(localStorage.getItem("pick")||"").split("-"); if(LEVELS[v[0]]) start=[v[0],+v[1]];}catch(e){} }
if(!start) start=["L1",1];
setLevel(start[0],start[1]);
window.addEventListener("hashchange",()=>{const s=fromHash(); if(s) setLevel(s[0],s[1]);});
</script>
</body>
</html>
